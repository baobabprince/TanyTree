name: Monthly Scrape and GEDCOM Update

on:
  schedule:
    # GitHub Actions does NOT support cron "L". Run on 28-31 and gate to real last day.
    - cron: '0 14 28-31 * *'
  workflow_dispatch:

jobs:
  check-date:
    runs-on: ubuntu-latest
    outputs:
      is_last_day: ${{ steps.check.outputs.is_last_day }}
    steps:
      - name: Check if it is the last day of the month
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered manually via workflow_dispatch. Bypassing date check."
            echo "is_last_day=true" >> $GITHUB_OUTPUT
          elif [ "$(date -u -d '+1 day' +%d)" = "01" ]; then
            echo "Scheduled run. Detected last day of the month (UTC)."
            echo "is_last_day=true" >> $GITHUB_OUTPUT
          else
            echo "Scheduled run. Not the last day of the month."
            echo "is_last_day=false" >> $GITHUB_OUTPUT
          fi

  update-genealogy:
    needs: check-date
    if: needs.check-date.outputs.is_last_day == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore genealogy.db from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -f genealogy.db ]; then
            echo "genealogy.db present in workspace (legacy checkout); keeping it as baseline."
            exit 0
          fi

          TAG=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease==false and (.tagName | test("^[0-9]{4}-[0-9]{2}$")))] | .[0].tagName // empty')

          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName // empty')
          fi

          if [ -n "$TAG" ]; then
            echo "Downloading genealogy.db from release $TAG ..."
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'genealogy.db' || true
          else
            echo "No prior release found."
          fi

          if [ ! -f genealogy.db ]; then
            BOOTSTRAP_SHA="43471a36883b21e85dc331ea43b06ee41ada8fbd"
            echo "Bootstrapping genealogy.db from git history ($BOOTSTRAP_SHA)..."
            curl -fsSL -o genealogy.db \
              "https://raw.githubusercontent.com/${{ github.repository }}/${BOOTSTRAP_SHA}/genealogy.db"
          fi

          if [ -f genealogy.db ]; then
            echo "Restored genealogy.db ($(wc -c < genealogy.db) bytes)"
          else
            echo "WARNING: genealogy.db not restored; crawl/retry will start from empty DB."
          fi

      - name: Retry failed/pending items
        run: python -m src.cli retry --limit 2000 --workers 3 --delay 2.0

      - name: Run incremental crawl
        run: python -m src.cli crawl --limit 2000 --workers 3 --delay 2.0

      - name: Offline enrich (gender, relationships, orphans)
        run: python -m src.cli enrich --db genealogy.db

      - name: Export to GEDCOM
        run: python -m src.cli export genealogy.ged

      - name: Print quality + summary
        run: |
          python -m src.cli quality --db genealogy.db
          python -m src.cli summary --db genealogy.db --report-file changes_summary.md

      - name: Upload changes report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: changes-summary-${{ github.run_number }}
          path: changes_summary.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Publish GitHub Release (db + ged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f genealogy.db ] || [ ! -f genealogy.ged ]; then
            echo "Missing genealogy.db or genealogy.ged; skipping release."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$(date -u +%Y-%m)-manual-${{ github.run_number }}"
            TITLE="TanyTree ${TAG} (manual)"
            PRERELEASE_FLAG="--prerelease"
          else
            TAG="$(date -u +%Y-%m)"
            TITLE="TanyTree snapshot ${TAG}"
            PRERELEASE_FLAG=""
          fi

          NOTES="Automated tree snapshot from workflow run ${{ github.run_number }}. Event: ${{ github.event_name }}. Commit: ${{ github.sha }}. Download genealogy.db and genealogy.ged from Assets. changes_summary.md is a workflow artifact only."

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating assets."
            gh release upload "$TAG" genealogy.db genealogy.ged --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES" $PRERELEASE_FLAG
          else
            echo "Creating release $TAG ..."
            gh release create "$TAG" genealogy.db genealogy.ged \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi

          echo "Published release: $TAG"

      - name: Prune old releases (keep 5 latest stable + first; trim manual)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mapfile -t STABLE < <(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease==false and (.tagName | test("^[0-9]{4}-[0-9]{2}$")))] | sort_by(.createdAt) | .[].tagName')

          COUNT=${#STABLE[@]}
          echo "Stable releases ($COUNT): ${STABLE[*]}"

          if [ "$COUNT" -gt 6 ]; then
            KEEP_FIRST="${STABLE[0]}"
            DECLARE_KEEP=()
            for ((i=COUNT-5; i<COUNT; i++)); do
              DECLARE_KEEP+=("${STABLE[i]}")
            done
            for TAG in "${STABLE[@]}"; do
              if [ "$TAG" = "$KEEP_FIRST" ]; then
                continue
              fi
              SKIP=false
              for K in "${DECLARE_KEEP[@]}"; do
                if [ "$TAG" = "$K" ]; then SKIP=true; break; fi
              done
              if [ "$SKIP" = true ]; then
                continue
              fi
              echo "Deleting old stable release: $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            done
          else
            echo "No stable pruning needed."
          fi

          mapfile -t PRE < <(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease==true)] | sort_by(.createdAt) | reverse | .[].tagName')

          PRE_COUNT=${#PRE[@]}
          echo "Prereleases ($PRE_COUNT): ${PRE[*]}"
          if [ "$PRE_COUNT" -gt 3 ]; then
            for ((i=3; i<PRE_COUNT; i++)); do
              echo "Deleting old prerelease: ${PRE[i]}"
              gh release delete "${PRE[i]}" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            done
          fi
